[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transformation-engine"
version = "0.1.0"
description = "YAML-driven transformation engine for Databricks DLT pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "typing-extensions>=4.0",
]

# Note: PySpark and dlt are provided by the Databricks runtime
# and should not be included in production dependencies.

[project.optional-dependencies]
dev = [
    # Linting
    "ruff>=0.1.0",
    # Type checking
    "mypy>=1.0",
    "types-PyYAML>=6.0",
    # Code formatting
    "black>=23.0",
    "isort>=5.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.isort]
known-first-party = ["engine", "transforms"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["engine", "transforms"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
