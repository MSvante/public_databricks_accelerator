[project]
name = "ldp-framework"
version = "0.2.0"
description = "Config-driven Lakeflow Declarative Pipelines framework for Databricks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]
# PySpark, pyspark.pipelines and databricks-sdk are provided by Databricks.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyspark>=4.1",       # 4.1+ ships pyspark.pipelines; Spark tests need Java
    "databricks-sdk>=0.40",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["framework", "data_products"]

[tool.ruff.lint.per-file-ignores]
"src/jobs/generate_sample_data.py" = ["E501"]  # sample-data literals read better on one line
