# =============================================================================
# Config-driven Lakeflow Declarative Pipelines - Databricks Asset Bundle
# =============================================================================
# Everything is serverless, so the bundle runs on Databricks Free Edition.
#
#   databricks bundle deploy -t sandbox
#   databricks bundle run ldp_setup -t sandbox
#   databricks bundle run ldp_sample_data -t sandbox            # --batch initial
#   databricks bundle run ldp_ingest -t sandbox                 # guard -> pipeline -> reconcile
#
# Targets
#   sandbox  personal: every table in one schema per developer, no PII vault
#   dev      shared: schemas per layer/domain, vaulted + public PII streams
#   prod     shared, production mode, schedule unpaused
# =============================================================================

bundle:
  name: ldp_framework

include:
  - resources/*.yml

sync:
  include:
    - "conf/*.yml"
    - "src/**/*.py"

variables:
  catalog:
    description: Unity Catalog catalog. Free Edition ships with one called `workspace`.
    default: workspace
  sandbox_schema:
    description: Personal schema for the sandbox target (ignored elsewhere).
    default: sandbox_${workspace.current_user.short_name}
  landing_root:
    description: UC volume holding the landing files (created by ldp_setup).
    default: /Volumes/${var.catalog}/landing/files
  schedule_pause_status:
    description: PAUSED everywhere except prod.
    default: PAUSED
  alert_emails:
    type: complex
    default: []

targets:
  sandbox:
    mode: development
    default: true

  dev:
    mode: development
    # workspace:
    #   host: https://<your-dev-workspace>

  prod:
    mode: production
    # workspace:
    #   host: https://<your-prod-workspace>
    variables:
      schedule_pause_status: UNPAUSED
