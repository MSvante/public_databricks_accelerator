# =============================================================================
# ENTSOG Silver Layer Configuration
# =============================================================================
# Defines transformed tables for ENTSOG data.
# =============================================================================

source_system: entsog
layer: silver

tables:
  - name: physical_flows_clean
    raw_tables: physical_flows
    transform: transforms/entsog/physical_flows.py
    expectations:
      - name: valid_point_key
        expression: "point_key IS NOT NULL"
        action: drop
      - name: valid_flow_value
        expression: "value IS NOT NULL"
        action: warn

  - name: nominations_clean
    raw_tables: nominations
    transform: transforms/entsog/nominations.py
    expectations:
      - name: valid_nomination_id
        expression: "nomination_id IS NOT NULL"
        action: drop

  - name: allocations_clean
    raw_tables: allocations
    transform: transforms/entsog/allocations.py
    expectations:
      - name: valid_allocation_id
        expression: "allocation_id IS NOT NULL"
        action: drop

  - name: connection_points_clean
    raw_tables: connection_points
    transform: transforms/entsog/connection_points.py
    expectations:
      - name: valid_point_key
        expression: "point_key IS NOT NULL"
        action: drop
