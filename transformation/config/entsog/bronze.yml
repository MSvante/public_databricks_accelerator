# =============================================================================
# ENTSOG Bronze Layer Configuration
# =============================================================================
# Defines tables to ingest from the landing zone for ENTSOG data.
# =============================================================================

source_system: entsog
layer: bronze

defaults:
  source_format: parquet
  schema_evolution:
    add_new_columns: true
    merge_schema: true

tables:
  - name: physical_flows
    source_path: ${var.landing_zone_uri}/entsog/physical_flows/

  - name: nominations
    source_path: ${var.landing_zone_uri}/entsog/nominations/

  - name: allocations
    source_path: ${var.landing_zone_uri}/entsog/allocations/

  - name: connection_points
    source_path: ${var.landing_zone_uri}/entsog/connection_points/
