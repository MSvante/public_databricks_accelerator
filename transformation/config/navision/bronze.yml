# =============================================================================
# Bronze Layer Configuration - Navision
# =============================================================================
# Defines bronze (raw) tables for the Navision source system.
#
# Tables are created as streaming tables using Auto Loader (cloudFiles).
# Housekeeping columns are added automatically:
#   - _ingested_at: Ingestion timestamp
#   - _source_file: Source file path
#   - _modified_at: File modification time
#   - _source_system: Source system identifier
# =============================================================================

source_system: navision
layer: bronze

# -----------------------------------------------------------------------------
# Default Settings
# -----------------------------------------------------------------------------
# Applied to all tables unless overridden at the table level.

defaults:
  source_format: parquet
  schema_evolution:
    add_new_columns: true
    merge_schema: true

# -----------------------------------------------------------------------------
# Table Definitions
# -----------------------------------------------------------------------------
# Each table maps to a path in the landing zone.
# Path pattern: ${landing_zone_uri}/${source_system}/<entity>/

tables:
  # ---------------------------------------------------------------------------
  # Customers
  # ---------------------------------------------------------------------------
  - name: customers
    source_path: ${var.landing_zone_uri}/${var.source_system}/customers/

  # ---------------------------------------------------------------------------
  # Orders
  # ---------------------------------------------------------------------------
  - name: orders
    source_path: ${var.landing_zone_uri}/${var.source_system}/orders/

  # ---------------------------------------------------------------------------
  # Products
  # ---------------------------------------------------------------------------
  - name: products
    source_path: ${var.landing_zone_uri}/${var.source_system}/products/

  # ---------------------------------------------------------------------------
  # Order Lines (Detail)
  # ---------------------------------------------------------------------------
  - name: order_lines
    source_path: ${var.landing_zone_uri}/${var.source_system}/order_lines/

  # ---------------------------------------------------------------------------
  # Vendors
  # ---------------------------------------------------------------------------
  - name: vendors
    source_path: ${var.landing_zone_uri}/${var.source_system}/vendors/
