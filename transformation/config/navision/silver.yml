# =============================================================================
# Silver Layer Configuration - Navision
# =============================================================================
# Defines silver (cleansed) tables for the Navision source system.
#
# Tables are created as materialized views with:
#   - Python transformations for data cleaning
#   - Data quality expectations for validation
#   - Joins between bronze and silver tables
# =============================================================================

source_system: navision
layer: silver

# -----------------------------------------------------------------------------
# Table Definitions
# -----------------------------------------------------------------------------
# Each table specifies:
#   - raw_tables: Input tables (comma-separated for joins)
#   - transform: Path to Python transform module
#   - expectations: Data quality rules

tables:
  # ---------------------------------------------------------------------------
  # Customers (Cleaned)
  # ---------------------------------------------------------------------------
  - name: customers_clean
    raw_tables: customers
    transform: transforms/navision/customers.py
    expectations:
      - name: valid_customer_id
        expression: "customer_id IS NOT NULL"
        action: drop
      - name: valid_email_format
        expression: "email IS NULL OR email LIKE '%@%'"
        action: warn
      - name: valid_name
        expression: "name IS NOT NULL AND LENGTH(TRIM(name)) > 0"
        action: warn

  # ---------------------------------------------------------------------------
  # Products (Cleaned)
  # ---------------------------------------------------------------------------
  - name: products_clean
    raw_tables: products
    transform: transforms/navision/products.py
    expectations:
      - name: valid_product_id
        expression: "product_id IS NOT NULL"
        action: drop
      - name: valid_product_name
        expression: "product_name IS NOT NULL"
        action: warn
      - name: positive_price
        expression: "unit_price IS NULL OR unit_price >= 0"
        action: warn

  # ---------------------------------------------------------------------------
  # Vendors (Cleaned)
  # ---------------------------------------------------------------------------
  - name: vendors_clean
    raw_tables: vendors
    transform: transforms/navision/vendors.py
    expectations:
      - name: valid_vendor_id
        expression: "vendor_id IS NOT NULL"
        action: drop

  # ---------------------------------------------------------------------------
  # Orders (Enriched with Customer Data)
  # ---------------------------------------------------------------------------
  - name: orders_enriched
    raw_tables: orders, customers_clean
    transform: transforms/navision/orders.py
    expectations:
      - name: valid_order_id
        expression: "order_id IS NOT NULL"
        action: drop
      - name: valid_order_date
        expression: "order_date IS NOT NULL"
        action: warn
      - name: positive_total
        expression: "order_total IS NULL OR order_total >= 0"
        action: warn

  # ---------------------------------------------------------------------------
  # Order Lines (Enriched with Product Data)
  # ---------------------------------------------------------------------------
  - name: order_lines_enriched
    raw_tables: order_lines, orders_enriched, products_clean
    transform: transforms/navision/order_lines.py
    expectations:
      - name: valid_line_id
        expression: "line_id IS NOT NULL"
        action: drop
      - name: positive_quantity
        expression: "quantity > 0"
        action: drop
      - name: positive_line_total
        expression: "line_total >= 0"
        action: warn
