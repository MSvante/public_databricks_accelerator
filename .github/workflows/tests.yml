# Unit tests + lint. Needs no secrets, so it runs on every PR.
# Java is installed so the Spark-backed tests run here (they skip locally
# without Java).
name: Tests

on:
  pull_request:
    paths: ['transformation/**', '.github/workflows/tests.yml']
  push:
    branches: [main]
    paths: ['transformation/**', '.github/workflows/tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./transformation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        # Same pins as [project.optional-dependencies].dev; no package build needed
        run: pip install "PyYAML>=6.0" "pytest>=8.0" "pyspark>=4.1" "databricks-sdk>=0.40" "ruff>=0.6"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
